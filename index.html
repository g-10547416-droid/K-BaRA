<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>K-BaRa AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /*
      MindAR inserts the phone-camera video
      directly into the page.
    */
    body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      z-index: 1 !important;

      display: block !important;

      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      z-index: 2 !important;

      background: transparent !important;
    }

    .a-canvas {
      background: transparent !important;
    }

    #instruction {
      position: fixed;

      top: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0, 0, 0, 0.72);

      color: white;

      padding: 12px 22px;

      border-radius: 28px;

      font-size: 18px;

      text-align: center;

      width: max-content;
      max-width: 85%;
    }

    #watchButton {
      display: none;

      position: fixed;

      bottom: 40px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      border: none;

      border-radius: 30px;

      padding: 15px 28px;

      background: white;

      color: black;

      font-size: 19px;

      font-weight: bold;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    #videoScreen {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 20000;

      background: black;

      align-items: center;
      justify-content: center;
    }

    #storyVideo {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: black;
    }

    #closeVideo {
      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 20001;

      width: 50px;
      height: 50px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background: white;

      color: black;

      font-size: 28px;

      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="instruction">
    Halakan kamera pada gambar.
  </div>

  <button id="watchButton">
    ▶ Tonton Cerita
  </button>

  <div id="videoScreen">

    <button id="closeVideo">
      ×
    </button>

    <video
      id="storyVideo"
      src="./Hari-Sukan.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>

  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiScanning: no;
      uiLoading: yes;
      uiError: yes;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>


  <script>
    const target =
      document.querySelector("#imageTarget");

    const instruction =
      document.querySelector("#instruction");

    const watchButton =
      document.querySelector("#watchButton");

    const videoScreen =
      document.querySelector("#videoScreen");

    const storyVideo =
      document.querySelector("#storyVideo");

    const closeVideo =
      document.querySelector("#closeVideo");


    target.addEventListener("targetFound", () => {

      instruction.innerHTML =
        "Gambar dikesan!";

      watchButton.style.display =
        "block";

    });


    target.addEventListener("targetLost", () => {

      if (videoScreen.style.display !== "flex") {

        instruction.innerHTML =
          "Halakan kamera pada gambar.";

        watchButton.style.display =
          "none";
      }

    });


    watchButton.addEventListener("click", async () => {

      videoScreen.style.display =
        "flex";

      instruction.style.display =
        "none";

      watchButton.style.display =
        "none";

      storyVideo.currentTime = 0;

      try {

        await storyVideo.play();

      } catch (error) {

        console.log(error);

      }

    });


    closeVideo.addEventListener("click", () => {

      storyVideo.pause();

      videoScreen.style.display =
        "none";

      instruction.style.display =
        "block";

      instruction.innerHTML =
        "Halakan kamera pada gambar.";

    });


    /*
      Extra safeguard:
      after MindAR creates the camera video,
      force it to stay visible.
    */

    const observer =
      new MutationObserver(() => {

        const videos =
          document.querySelectorAll("body > video");

        videos.forEach(video => {

          if (video.id !== "storyVideo") {

            video.style.display = "block";
            video.style.position = "fixed";
            video.style.top = "0";
            video.style.left = "0";
            video.style.width = "100vw";
            video.style.height = "100vh";
            video.style.objectFit = "cover";
            video.style.zIndex = "1";

          }

        });

      });


    observer.observe(
      document.body,
      {
        childList: true
      }
    );

  </script>

</body>
</html>
