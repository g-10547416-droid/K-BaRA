<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K-BaRa AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
    }

    .message {
      background: rgba(0,0,0,.72);
      color: #fff;
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 18px;
      text-align: center;
      max-width: 90%;
    }

    .bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: auto;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      color: #111;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: linear-gradient(180deg, #fff7d6, #ffe4b5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .startCard {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #fff;
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15);
    }

    .startCard h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .startCard p {
      margin: 0 0 22px;
      font-size: 18px;
      line-height: 1.45;
      color: #333;
    }

    #replayBtn { display: none; }
    #playBtn { display: none; }
  </style>
</head>

<body>

<div id="startScreen">
  <div class="startCard">
    <h1>K-BaRa AR</h1>
    <p>Terokai cerita K-BaRa dalam bentuk interaktif.</p>
    <button id="startBtn">Mulakan AR</button>
  </div>
</div>

<div id="ui">
  <div class="topbar">
    <div id="message" class="message">Halakan kamera pada gambar.</div>
  </div>

  <div class="bottom">
    <button id="playBtn">▶ Tonton Cerita</button>
    <button id="replayBtn">↻ Tonton Semula</button>
  </div>
</div>

<a-scene
  id="arScene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="storyVideo"
      src="./Hari-Sukan.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video
      id="videoPlane"
      src="#storyVideo"
      position="0 0 0.01"
      width="1"
      height="0.5625"
      visible="false">
    </a-video>
  </a-entity>
</a-scene>

<script>
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const message = document.getElementById('message');
  const sceneEl = document.getElementById('arScene');
  const target = document.getElementById('target');
  const video = document.getElementById('storyVideo');
  const videoPlane = document.getElementById('videoPlane');

  let targetVisible = false;

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Membuka kamera...';

    try {
      const arSystem = sceneEl.systems['mindar-image-system'];
      await arSystem.start();
      startScreen.style.display = 'none';
      message.textContent = 'Halakan kamera pada gambar.';
    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = 'Cuba Lagi';
      const p = startScreen.querySelector('p');
      p.textContent = 'Kamera tidak dapat dibuka. Benarkan akses kamera dan cuba lagi.';
    }
  });

  target.addEventListener('targetFound', () => {
    targetVisible = true;
    message.textContent = 'Gambar dikesan!';
    videoPlane.setAttribute('visible', 'true');

    if (video.ended) {
      replayBtn.style.display = 'inline-block';
      playBtn.style.display = 'none';
    } else if (video.paused) {
      playBtn.style.display = 'inline-block';
      replayBtn.style.display = 'none';
    }
  });

  target.addEventListener('targetLost', () => {
    targetVisible = false;
    if (!video.paused) video.pause();
    message.textContent = 'Halakan kamera pada gambar.';
    playBtn.style.display = 'none';
    replayBtn.style.display = 'none';
  });

  playBtn.addEventListener('click', async () => {
    if (!targetVisible) return;
    try {
      video.muted = false;
      await video.play();
      playBtn.style.display = 'none';
      message.textContent = 'Selamat menonton!';
    } catch (err) {
      console.error(err);
      message.textContent = 'Tekan sekali lagi untuk memainkan video.';
    }
  });

  replayBtn.addEventListener('click', async () => {
    if (!targetVisible) return;
    video.currentTime = 0;
    video.muted = false;
    await video.play();
    replayBtn.style.display = 'none';
    message.textContent = 'Selamat menonton!';
  });

  video.addEventListener('ended', () => {
    message.textContent = 'Cerita tamat.';
    if (targetVisible) replayBtn.style.display = 'inline-block';
  });
</script>

</body>
</html>
