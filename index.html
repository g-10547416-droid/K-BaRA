<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K-BaRa AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #fff7d6, #ffe4b5);
    }

    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }

    .card h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .card p {
      margin: 0 0 22px;
      font-size: 18px;
      line-height: 1.45;
      color: #333;
    }

    #message {
      position: fixed;
      z-index: 3000;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 11px 17px;
      border-radius: 18px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 17px;
      text-align: center;
      pointer-events: none;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 700;
      background: #fff;
      color: #111;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
      cursor: pointer;
    }

    #startBtn {
      background: #111;
      color: #fff;
    }

    #watchBtn {
      display: none;
      position: fixed;
      z-index: 3200;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(28px, env(safe-area-inset-bottom));
    }

    #videoOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 6000;
      background: #000;
      align-items: center;
      justify-content: center;
    }

    #storyVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #closeVideo {
      position: absolute;
      z-index: 6100;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      width: 46px;
      height: 46px;
      padding: 0;
      font-size: 25px;
      background: rgba(255,255,255,.92);
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <div class="card">
      <h1>K-BaRa AR</h1>
      <p>Terokai cerita K-BaRa dalam bentuk interaktif.</p>
      <button id="startBtn">Mulakan AR</button>
    </div>
  </div>

  <div id="message" style="display:none;">
    Halakan kamera pada gambar.
  </div>

  <button id="watchBtn">
    ▶ Tonton Cerita
  </button>

  <div id="videoOverlay">
    <button id="closeVideo" aria-label="Tutup">×</button>

    <video
      id="storyVideo"
      src="./Hari-Sukan.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: no;
      uiLoading: yes;
      uiError: yes;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled:false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {

      const scene = document.getElementById('arScene');
      const target = document.getElementById('target');
      const startScreen = document.getElementById('startScreen');
      const startBtn = document.getElementById('startBtn');
      const message = document.getElementById('message');
      const watchBtn = document.getElementById('watchBtn');
      const overlay = document.getElementById('videoOverlay');
      const video = document.getElementById('storyVideo');
      const closeVideo = document.getElementById('closeVideo');

      const waitForScene = () => new Promise(resolve => {
        if (scene.hasLoaded) {
          resolve();
        } else {
          scene.addEventListener('loaded', resolve, { once: true });
        }
      });

      startBtn.addEventListener('click', async () => {

        startBtn.disabled = true;
        startBtn.textContent = 'Membuka kamera...';

        try {

          await waitForScene();

          const arSystem = scene.systems['mindar-image-system'];

          await arSystem.start();

          startScreen.style.display = 'none';

          message.style.display = 'block';
          message.textContent = 'Halakan kamera pada gambar.';

        } catch (error) {

          console.error(error);

          startBtn.disabled = false;
          startBtn.textContent = 'Cuba Lagi';

          startScreen.querySelector('p').textContent =
            'Kamera tidak dapat dibuka. Benarkan akses kamera pada pelayar dan cuba lagi.';
        }
      });

      target.addEventListener('targetFound', () => {

        message.textContent = 'Gambar dikesan!';

        watchBtn.style.display = 'block';
      });

      target.addEventListener('targetLost', () => {

        if (overlay.style.display !== 'flex') {

          message.textContent = 'Halakan kamera pada gambar.';

          watchBtn.style.display = 'none';
        }
      });

      watchBtn.addEventListener('click', async () => {

        overlay.style.display = 'flex';

        watchBtn.style.display = 'none';

        message.style.display = 'none';

        video.currentTime = 0;
        video.muted = false;

        try {

          await video.play();

        } catch (error) {

          console.error(error);

        }
      });

      closeVideo.addEventListener('click', () => {

        video.pause();

        overlay.style.display = 'none';

        message.style.display = 'block';

        message.textContent = 'Halakan kamera pada gambar.';
      });

    });
  </script>

</body>
</html>
