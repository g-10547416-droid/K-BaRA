<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>K-BaRa AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Instruction */

    #instruction {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 12px 22px;

      border-radius: 25px;

      font-size: 18px;

      z-index: 9999;

      text-align: center;

      white-space: nowrap;
    }


    /* Watch button */

    #watchButton {

      display: none;

      position: fixed;

      bottom: 40px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 15px 28px;

      border: none;

      border-radius: 30px;

      background: white;

      color: black;

      font-size: 19px;

      font-weight: bold;

      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }


    /* Video screen */

    #videoScreen {

      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: black;

      z-index: 20000;

      justify-content: center;
      align-items: center;
    }


    #storyVideo {

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: black;
    }


    #closeVideo {

      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 20001;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 50%;

      background: white;

      font-size: 28px;

      font-weight: bold;
    }

  </style>

</head>


<body>


<div id="instruction">
  Halakan kamera pada gambar.
</div>


<button id="watchButton">
  ▶ Tonton Cerita
</button>


<div id="videoScreen">

  <button id="closeVideo">
    ×
  </button>

  <video
    id="storyVideo"
    src="./Hari-Sukan.mp4"
    controls
    playsinline
    webkit-playsinline>
  </video>

</div>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.001;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <a-entity

    id="imageTarget"

    mindar-image-target="targetIndex: 0">

  </a-entity>


</a-scene>



<script>

const target =
document.querySelector("#imageTarget");

const instruction =
document.querySelector("#instruction");

const watchButton =
document.querySelector("#watchButton");

const videoScreen =
document.querySelector("#videoScreen");

const video =
document.querySelector("#storyVideo");

const closeVideo =
document.querySelector("#closeVideo");



/* IMAGE FOUND */

target.addEventListener("targetFound", () => {

  instruction.innerHTML =
  "Gambar dikesan!";

  watchButton.style.display =
  "block";

});



/* IMAGE LOST */

target.addEventListener("targetLost", () => {

  if(videoScreen.style.display !== "flex") {

    instruction.innerHTML =
    "Halakan kamera pada gambar.";

    watchButton.style.display =
    "none";

  }

});



/* PLAY STORY */

watchButton.addEventListener("click", () => {

  videoScreen.style.display =
  "flex";

  instruction.style.display =
  "none";

  watchButton.style.display =
  "none";

  video.currentTime = 0;

  video.play();

});



/* CLOSE VIDEO */

closeVideo.addEventListener("click", () => {

  video.pause();

  videoScreen.style.display =
  "none";

  instruction.style.display =
  "block";

  instruction.innerHTML =
  "Halakan kamera pada gambar.";

});


</script>


</body>
</html>
